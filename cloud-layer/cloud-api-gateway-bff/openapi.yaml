openapi: 3.0.0
info:
  title: FarmIQ Cloud API Gateway BFF
  version: 1.0.0
  description: >
    Backend-for-Frontend for the FarmIQ dashboard. Aggregates data from cloud services
    (identity, tenant registry, telemetry, analytics) and exposes dashboard-friendly
    APIs. Does not access databases directly.

paths:
  /api/health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: OK

  /api/ready:
    get:
      summary: Readiness check
      tags: [System]
      responses:
        '200':
          description: Service is ready

  /api/v1/dashboard/overview:
    get:
      summary: Get tenant-level dashboard overview
      tags: [Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
          required: false
          description: >
            Tenant scope. Optional if JWT contains tenant_id claim. Required
            when caller is platform_admin querying another tenant.
      responses:
        '200':
          description: Overview data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '502':
          description: Downstream error

  /api/v1/dashboard/farms/{farmId}:
    get:
      summary: Get dashboard data for a specific farm
      tags: [Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: farmId
          required: true
          schema:
            type: string
        - in: query
          name: tenantId
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Farm dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDashboardResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '502':
          description: Downstream error

  /api/v1/dashboard/barns/{barnId}:
    get:
      summary: Get dashboard data for a specific barn
      tags: [Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: barnId
          required: true
          schema:
            type: string
        - in: query
          name: tenantId
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Barn dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarnDashboardResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '502':
          description: Downstream error

  /api/v1/dashboard/alerts:
    get:
      summary: Get alerts for current tenant
      tags: [Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Alerts data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '502':
          description: Downstream error

  # Feed Service Proxy Endpoints
  /api/v1/kpi/feeding:
    get:
      summary: Get feeding KPIs (FCR, ADG, SGR)
      tags: [Feed]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
          required: true
        - in: query
          name: barnId
          schema:
            type: string
          required: true
        - in: query
          name: batchId
          schema:
            type: string
          required: false
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
          required: true
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
          required: true
      responses:
        '200':
          description: KPI series data
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '502':
          description: Downstream service error

  /api/v1/feed/intake-records:
    post:
      summary: Create feed intake record
      tags: [Feed]
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
        '400':
          description: Validation error
        '409':
          description: Conflict (duplicate)
        '502':
          description: Downstream service error
    get:
      summary: List feed intake records
      tags: [Feed]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
          required: true
      responses:
