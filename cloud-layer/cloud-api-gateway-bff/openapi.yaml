    get:
      summary: List daily counts
      tags: [Barn Records]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
          required: true
        - in: query
          name: farmId
          schema:
            type: string
          required: false
        - in: query
          name: barnId
          schema:
            type: string
          required: false
        - in: query
          name: batchId
          schema:
            type: string
          required: false
        - in: query
          name: start
          schema:
            type: string
            format: date
          required: false
        - in: query
          name: end
          schema:
            type: string
            format: date
          required: false
      responses:
        '200':
          description: List of daily counts
        '400':
          description: Validation error
        '502':
          description: Downstream service error

  /api/v1/ops/health:
    get:
      summary: Get system health status
      tags: [Ops]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Ops health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsHealthResponse'
        '400':
          description: Validation error
        '502':
          description: Downstream service error

  /api/v1/audit/events:
    get:
      summary: Query audit events
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
          required: true
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: resource_type
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: List of audit events
        '400':
          description: Validation error
        '502':
          description: Downstream service error

  /api/v1/audit/events/{id}:
    get:
      summary: Get audit event by ID
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit event
        '404':
          description: Audit event not found
  /api/v1/devices:
    post:
      summary: Create device
      tags: [Registry]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - deviceType
              properties:
                tenantId:
                  type: string
                farmId:
                  type: string
                barnId:
                  type: string
                batchId:
                  type: string
                deviceType:
                  type: string
                serialNo:
                  type: string
                status:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Device created
        '400':
          description: Validation error
        '409':
          description: Conflict
        '502':
          description: Downstream service error

  /api/v1/edge/batch-context:
    get:
      summary: Get the authoritative Batch context snapshot or delta for an Edge site
      tags: [Edge Control]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: siteId
          required: true
          schema: { type: string }
        - in: query
          name: sinceRevision
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Batch context snapshot or delta with resolved model policy
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeBatchContextResponse'
        '304': { description: Context and model policy are unchanged }
        '400': { description: Invalid revision cursor }
        '401': { description: Missing or invalid service credential }
        '403': { description: Tenant or site is outside credential scope }
        '502': { description: Downstream service unavailable }

  /api/v1/batches/{batchId}/bindings:
    post:
      summary: Bind a device and optional station to a Batch
      tags: [Batches]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: batchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                tenantId: { type: string }
                deviceId: { type: string }
                stationId: { type: string, nullable: true }
      responses:
        '201': { description: Binding created }
        '400': { description: Validation error }
        '403': { description: Insufficient role or tenant scope }
        '422': { description: Device/station does not share the Batch scope }

  /api/v1/batches/{batchId}/bindings/{bindingId}:
    delete:
      summary: Remove a Batch device binding
      tags: [Batches]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: batchId
          required: true
          schema: { type: string }
        - in: path
          name: bindingId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Binding removed }
        '403': { description: Insufficient role or tenant scope }
        '404': { description: Binding not found }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EdgeBatchContextResponse:
      type: object
      required: [mode, reset, nextRevision, contexts, modelPolicy]
      properties:
        mode:
          type: string
          enum: [snapshot, delta]
        reset: { type: boolean }
        nextRevision: { type: integer, minimum: 0 }
        contexts:
          type: array
          items:
            type: object
            required: [batchId, tenantId, farmId, barnId, revision, species, deviceBindings, modelPolicy]
            properties:
              batchId: { type: string }
              tenantId: { type: string }
              farmId: { type: string }
              barnId: { type: string }
              revision: { type: integer }
              status: { type: string }
              species: { type: string }
              breedCode: { type: string, nullable: true }
              sex: { type: string, nullable: true }
              startDate: { type: string, format: date-time, nullable: true }
              endDate: { type: string, format: date-time, nullable: true }
              deviceBindings:
                type: array
                items:
                  type: object
                  properties:
                    bindingId: { type: string }
                    deviceId: { type: string }
                    stationId: { type: string, nullable: true }
              modelPolicy: { type: object }
        modelPolicy: { type: object }
    OverviewResponse:
      type: object
      properties:
        topology:
          description: Topology summary from tenant registry
          nullable: true
        telemetry:
          type: object
          properties:
            metrics:
              type: object
            aggregates:
              type: array
              items:
                type: object
        alerts:
          type: array
          items:
            type: object
        analyticsAvailable:
          type: boolean

    FarmDashboardResponse:
      type: object
      properties:
        farm:
          type: object
          nullable: true
        barns:
          type: array
          items:
            type: object
        telemetryAggregates:
          type: array
          items:
            type: object

    BarnDashboardResponse:
      type: object
      properties:
        barn:
          type: object
          nullable: true
        telemetryAggregates:
          type: array
          items:
            type: object
        telemetryReadings:
          type: array
          items:
            type: object

    AlertsResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            type: object
        analyticsAvailable:
          type: boolean

    OpsHealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            tenant_id:
              type: string
            generated_at:
              type: string
              format: date-time
            system_metrics:
              $ref: '#/components/schemas/OpsSystemMetrics'
            services:
              type: array
              items:
                $ref: '#/components/schemas/OpsHealthService'

    OpsSystemMetrics:
      type: object
      properties:
        cpu_usage_percent:
          type: number
          nullable: true
        memory_usage_percent:
          type: number
          nullable: true
        disk_usage_percent:
          type: number
          nullable: true
        network_in_mbps:
          type: number
          nullable: true
        network_out_mbps:
          type: number
          nullable: true

    OpsHealthService:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [healthy, degraded, critical, unknown]
        response_time_ms:
          type: number
          nullable: true
        uptime_percent:
          type: number
          nullable: true
