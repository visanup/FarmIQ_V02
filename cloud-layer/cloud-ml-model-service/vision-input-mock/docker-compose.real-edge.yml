# Dev-only full-path mode: the mock is an IoT capture producer and calls the
# real Edge Session and Media Store services. It intentionally has no aliases.
services:
  vision-input-mock-real-edge:
    image: ${VISION_INPUT_MOCK_IMAGE:-farmiq-vision-input-mock:dev}
    ports:
      - "5111:3000"
    environment:
      VISION_INFERENCE_URL: http://edge-vision-inference:8000
      EDGE_SESSION_URL: http://edge-weighvision-session:3000
      MEDIA_STORE_URL: http://edge-media-store:3000
      REAL_EDGE_INTEGRATION: "true"
      AUTO_SUBMIT_ENABLED: "false"
    volumes:
      - ./app.py:/app/app.py:ro
    networks:
      farmiq-edge-net:

networks:
  farmiq-edge-net:
    external: true
    name: farmiq-edge_farmiq-net
