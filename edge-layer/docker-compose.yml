# Common edge service definitions.
# Use together with an environment-specific override such as docker-compose.dev.yml.

services:
  # ============================================
  # EDGE SERVICES - BASE CONFIGURATION
  # ============================================
  
  edge-cloud-ingestion-mock:
    restart: unless-stopped
    build:
      context: ./edge-cloud-ingestion-mock
      dockerfile: Dockerfile.dev
    container_name: farmiq-edge-cloud-ingestion-mock
    networks:
      - farmiq-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-mqtt-broker:
    restart: unless-stopped
    build:
      context: ./edge-mqtt-broker
      dockerfile: Dockerfile
    container_name: farmiq-edge-mqtt
    ports:
      - "5100:1883"   # Plain MQTT (dev only)
      - "5101:8883"   # TLS MQTT (production)
    volumes:
      - ./edge-mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge-mqtt-broker/certs:/mosquitto/config/certs:ro  # TLS certificates
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    environment:
      - MQTT_TLS_ENABLED=${MQTT_TLS_ENABLED:-false}
    networks:
      - farmiq-net
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "$$SYS/health", "-m", "ping", "-q", "0"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-ingress-gateway:
    restart: unless-stopped
    build:
      context: ./edge-ingress-gateway
      dockerfile: Dockerfile
    container_name: farmiq-edge-ingress-gateway
    ports:
      - "5103:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_ingress_gateway
      - MQTT_BROKER_URL=mqtt://edge-mqtt-broker:1883
      - EDGE_TELEMETRY_TIMESERIES_URL=http://edge-telemetry-timeseries:3000
      - EDGE_WEIGHVISION_SESSION_URL=http://edge-weighvision-session:3000
      - DOWNSTREAM_TIMEOUT_MS=5000
      - DEDUPE_TTL_MS=259200000
      - DEDUPE_CLEANUP_INTERVAL_MS=60000
      - DD_SERVICE=edge-ingress-gateway
      - DD_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      edge-mqtt-broker:
        condition: service_started
      edge-telemetry-timeseries:
        condition: service_healthy
      edge-weighvision-session:
        condition: service_healthy
    networks:
      - farmiq-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-telemetry-timeseries:
    restart: unless-stopped
    build:
      context: ./edge-telemetry-timeseries
      dockerfile: Dockerfile
    container_name: farmiq-edge-telemetry-timeseries
    ports:
      - "5104:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_telemetry_timeseries
      - DD_SERVICE=edge-telemetry-timeseries
      - DD_ENV=production
    networks:
      - farmiq-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-weighvision-session:
    restart: unless-stopped
    build:
      context: ./edge-weighvision-session
      dockerfile: Dockerfile
    container_name: farmiq-edge-weighvision-session
    ports:
      - "5105:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_weighvision_session
      - DD_SERVICE=edge-weighvision-session
      - DD_ENV=production
    networks:
      - farmiq-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-media-store:
    restart: unless-stopped
    build:
      context: ./edge-media-store
      dockerfile: Dockerfile
    container_name: farmiq-edge-media-store
    ports:
      - "5106:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_media_store
      - MEDIA_STORAGE_PATH=/data/media
      - TRIGGER_INFERENCE_ON_COMPLETE=true
      - EDGE_VISION_INFERENCE_URL=http://edge-vision-inference:8000
      - DD_SERVICE=edge-media-store
      - DD_ENV=production
    volumes:
      - ./data/edge-media:/data/media
    networks:
      - farmiq-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-vision-inference:
    restart: unless-stopped
    build:
      context: ./edge-vision-inference
      dockerfile: Dockerfile
    container_name: farmiq-edge-vision-inference
    ports:
      - "5107:8000"
    environment:
      - LOG_LEVEL=INFO
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_vision_inference
      - MEDIA_STORE_URL=http://edge-media-store:3000
      - DD_SERVICE=edge-vision-inference
      - DD_ENV=production
    volumes:
      - ./data/edge-media:/data/media:ro
    networks:
      - farmiq-net
    depends_on:
      edge-media-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-sync-forwarder:
    restart: unless-stopped
    build:
      context: ./edge-sync-forwarder
      dockerfile: Dockerfile
    container_name: farmiq-edge-sync-forwarder
    ports:
      - "5108:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_sync_forwarder
      - CLOUD_INGESTION_URL=${CLOUD_INGESTION_URL:-http://edge-cloud-ingestion-mock:3000/api/v1/edge/batch}
      - CLOUD_INGESTION_URL_REQUIRED=true
      - CLOUD_AUTH_MODE=${CLOUD_AUTH_MODE:-api_key}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-edge-local-key}
      - OUTBOX_MAX_ATTEMPTS=${OUTBOX_MAX_ATTEMPTS:-10}
      - INTERNAL_ADMIN_ENABLED=${INTERNAL_ADMIN_ENABLED:-true}
      - DD_SERVICE=edge-sync-forwarder
      - DD_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      edge-cloud-ingestion-mock:
        condition: service_healthy
    networks:
      - farmiq-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-policy-sync:
    restart: unless-stopped
    build:
      context: ./edge-policy-sync
      dockerfile: Dockerfile
    container_name: farmiq-edge-policy-sync
    ports:
      - "5109:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_policy_sync
      - BFF_BASE_URL=http://cloud-api-gateway-bff:3000
      - EDGE_CLOUD_TOKEN=${EDGE_CLOUD_TOKEN:-}
      - POLICY_SYNC_INTERVAL_SECONDS=60
      - POLICY_SYNC_BACKOFF_CAP_SECONDS=600
      - POLICY_SYNC_TIMEOUT_SECONDS=10
      - EDGE_CONTEXTS=${EDGE_CONTEXTS:-[]}
      - DD_SERVICE=edge-policy-sync
      - DD_ENV=production
    networks:
      - farmiq-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-retention-janitor:
    restart: unless-stopped
    build:
      context: ./edge-retention-janitor
      dockerfile: Dockerfile
    container_name: farmiq-edge-retention-janitor
    ports:
      - "5114:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_retention_janitor
      - MEDIA_BASE_PATH=/data/media
      - MEDIA_RETENTION_DAYS=7
      - MIN_FREE_DISK_GB=5
      - JANITOR_INTERVAL_SECONDS=21600
      - JANITOR_DRY_RUN=true
      - DD_SERVICE=edge-retention-janitor
      - DD_ENV=production
    volumes:
      - ./data/edge-media:/data/media
    networks:
      - farmiq-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-observability-agent:
    restart: unless-stopped
    build:
      context: ./edge-observability-agent
      dockerfile: Dockerfile
    container_name: farmiq-edge-observability-agent
    ports:
      - "5111:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - OBS_POLL_INTERVAL_SECONDS=30
      - DISK_PATH=/
      - EDGE_INGRESS_URL=http://edge-ingress-gateway:3000
      - EDGE_TELEMETRY_URL=http://edge-telemetry-timeseries:3000
      - EDGE_WEIGHVISION_URL=http://edge-weighvision-session:3000
      - EDGE_VISION_URL=http://edge-vision-inference:8000
      - EDGE_MEDIA_URL=http://edge-media-store:3000
      - EDGE_SYNC_URL=http://edge-sync-forwarder:3000
      - DD_SERVICE=edge-observability-agent
      - DD_ENV=production
    networks:
      - farmiq-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-feed-intake:
    restart: unless-stopped
    build:
      context: ./edge-feed-intake
      dockerfile: Dockerfile
    container_name: farmiq-edge-feed-intake
    ports:
      - "5112:5109"
    environment:
      - NODE_ENV=production
      - APP_PORT=5109
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farmiq}:${POSTGRES_PASSWORD:-farmiq_dev}@postgres:5432/edge_feed_intake
      - MQTT_BROKER_URL=mqtt://edge-mqtt-broker:1883
      - MQTT_CLIENT_ID=edge-feed-intake
      - EDGE_SYNC_FORWARDER_URL=http://edge-sync-forwarder:3000
      - DD_SERVICE=edge-feed-intake
      - DD_ENV=production
    networks:
      - farmiq-net
    depends_on:
      postgres:
        condition: service_healthy
      edge-mqtt-broker:
        condition: service_started
      edge-sync-forwarder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5109/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  edge-ops-web:
    restart: unless-stopped
    build:
      context: ./edge-ops-web
      dockerfile: Dockerfile
    container_name: farmiq-edge-ops-web
    ports:
      - "5113:80"
    networks:
      - farmiq-net
    depends_on:
      - edge-ingress-gateway
      - edge-observability-agent
      - edge-sync-forwarder
      - edge-telemetry-timeseries
      - edge-weighvision-session
      - edge-media-store
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
networks:
  farmiq-net:
    driver: bridge
  
volumes:
  mqtt_data:
  mqtt_log:
