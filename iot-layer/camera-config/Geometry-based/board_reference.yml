board:
  name: blue_reference_board
  color: blue
  size_mm:
    width: 510
    height: 540
roi:
  offset_mm:
    x: 130
    y: -10
  size_scale:
    x: 1.25
    y: 1
  padding_mm:
    x: 0
    y: 0
camera:
  distance_to_board_mm: 1350
reference_plane:
  axis: Z
  z_mm: 1350
  normal:
    - 0
    - 0
    - 1
measurement:
  unit:
    length: mm
  usage:
    - pixel_to_mm_scale
    - object_width_height_estimation
    - object_height_from_depth
metadata:
  created_by: weight-vision-calibrator
  description: |
    Blue reference board with known dimensions used as a metric reference for stereo vision measurement (W, L, H).
